name: Check live Umami tracking

on:
  push:
    branches: [codex/check-umami]

permissions: {}

jobs:
  browser-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Test analytics in Chrome
        env:
          SITE_URL: https://nilskoster.com/
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/umami-check" playwright
          xvfb-run -a node <<'JS'
          const path = require("node:path");
          const { chromium } = require(path.join(process.env.RUNNER_TEMP, "umami-check/node_modules/playwright"));
          const log = (...fields) => console.log("UMAMI CHECK", ...fields);
          const isUmami = (url) => /(^|\.)umami\.is$/.test(new URL(url).hostname);
          const endpoint = (url) => new URL(url).origin + new URL(url).pathname;

          async function check() {
            const browser = await chromium.launch({ channel: "chrome", headless: false });
            try {
              const page = await browser.newPage();
              const collectorResponses = [];
              const pending = [];
              page.on("response", response => {
                if (!isUmami(response.url())) return;
                const request = response.request();
                log(request.method(), endpoint(response.url()), response.status());
                if (request.method() !== "POST") return;
                collectorResponses.push(response.status());
                const payload = request.postDataJSON()?.payload;
                log("Page sent:", payload?.url, "hostname:", payload?.hostname);
                pending.push(response.json().then(result => {
                  log("Collector response fields:", Object.keys(result).join(", "));
                  if (result.error) log("Collector error:", String(result.error).slice(0, 160));
                }).catch(() => {}));
              });
              page.on("requestfailed", request => {
                if (isUmami(request.url())) {
                  log("Failed request:", endpoint(request.url()), request.failure()?.errorText);
                }
              });
              page.on("console", message => {
                if (message.type() === "error" && /umami|CORS/i.test(message.text())) {
                  log("Browser error:", message.text().slice(0, 250));
                }
              });
              const url = new URL(process.env.SITE_URL);
              url.searchParams.set("utm_source", "umami_setup_test");
              const documentResponse = await page.goto(url.href, { waitUntil: "load", timeout: 20000 });
              log("Website:", page.url(), documentResponse?.status());
              const tag = page.locator("script[data-website-id]");
              log("Tracking tags:", await tag.count());
              if (await tag.count() === 1) {
                log("Tracker source:", await tag.getAttribute("src"));
                log("Website ID matches:", await tag.getAttribute("data-website-id") === "893ca80d-f9e9-4109-9162-9be09d838407");
              }
              const waitForPost = () => page.waitForResponse(response => {
                return isUmami(response.url()) && response.request().method() === "POST";
              }, { timeout: 6000 }).catch(() => null);
              if (!collectorResponses.length) await waitForPost();
              log("Tracker API type:", await page.evaluate(() => typeof window.umami));
              if (await page.locator("#tab-cv").count()) {
                const posted = waitForPost();
                await page.locator("#tab-cv").click();
                await posted;
              }
              await Promise.allSettled(pending);
              log("Collector POST response statuses:", collectorResponses.join(", ") || "none");
            } finally {
              await browser.close();
            }
          }

          check().catch(error => {
            log("Browser test error:", error.message);
            process.exitCode = 1;
          });
          JS
